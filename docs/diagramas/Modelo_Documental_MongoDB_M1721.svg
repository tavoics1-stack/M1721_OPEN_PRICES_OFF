<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="860" viewBox="0 0 1000 860"><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" fill="#161616"><text x="35" y="45" font-size="31" font-weight="bold">Modelo documental MongoDB M1721</text><rect x="35" y="90" width="910" height="96" fill="white" stroke="#454545" stroke-width="2"/><rect x="35" y="90" width="910" height="48" fill="#e6e8e9"/><text x="51" y="122" font-size="23" font-weight="bold">Base m1721_004</text><text x="51" y="168" font-size="20" font-weight="normal">Colección off_product_snapshots · 86 respuestas · 79 encontradas · 7 no encontradas</text><path d="M470,186 L470,260" fill="none" stroke="#555" stroke-width="2.5"/><rect x="80" y="260" width="820" height="189" fill="white" stroke="#454545" stroke-width="2"/><rect x="80" y="260" width="820" height="48" fill="#e6e8e9"/><text x="96" y="292" font-size="23" font-weight="bold">Documento archivado</text><text x="96" y="338" font-size="20" font-weight="normal">_id [índice único del motor]</text><text x="96" y="369" font-size="20" font-weight="normal">requested_code · source_sha256 [índice compuesto UNIQUE]</text><text x="96" y="400" font-size="20" font-weight="normal">found · acquired_at · api_version · http_status</text><text x="96" y="431" font-size="20" font-weight="normal">response [objeto con la respuesta OFF privada]</text><path d="M470,450 L470,495" fill="none" stroke="#555" stroke-width="2.5"/><rect x="145" y="495" width="700" height="189" fill="white" stroke="#454545" stroke-width="2"/><rect x="145" y="495" width="700" height="48" fill="#e6e8e9"/><text x="161" y="527" font-size="23" font-weight="bold">response.product [opcional]</text><text x="161" y="573" font-size="20" font-weight="normal">code · product_name · brands</text><text x="161" y="604" font-size="20" font-weight="normal">categories_tags [array]</text><text x="161" y="635" font-size="20" font-weight="normal">nutriscore_grade · nova_group</text><text x="161" y="666" font-size="20" font-weight="normal">last_modified_t [marca temporal, no fecha del precio]</text><text x="35" y="750" font-size="21" font-weight="normal">Otros índices: response.product.brands y response.product.categories_tags.</text><text x="35" y="789" font-size="19" font-weight="normal">La figura omite campos privados. PUBLIC_DEMO guarda una proyección de 79 fichas, no 86 respuestas.</text><text x="35" y="828" font-size="19" font-weight="normal">No hay FK física hacia PostgreSQL. Python compara product_code con requested_code y product.code.</text></g></svg>