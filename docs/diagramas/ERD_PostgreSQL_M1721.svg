<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900"><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" fill="#161616"><text x="35" y="44" font-size="32" font-weight="bold">Modelo relacional PostgreSQL M1721</text><text x="35" y="82" font-size="21" font-weight="normal">Base m1721_004 · esquema m1721_004 · claves consultadas en pg_catalog</text><rect x="540" y="160" width="420" height="313" fill="white" stroke="#454545" stroke-width="2"/><rect x="540" y="160" width="420" height="48" fill="#e6e8e9"/><text x="556" y="192" font-size="23" font-weight="bold">precios · 307.183 filas</text><text x="556" y="238" font-size="20" font-weight="normal">PK id (alias price_id en la vista)</text><text x="556" y="269" font-size="20" font-weight="normal">type (alias price_type al presentar)</text><text x="556" y="300" font-size="20" font-weight="normal">price · currency · date</text><text x="556" y="331" font-size="20" font-weight="normal">FK product_code [nullable]</text><text x="556" y="362" font-size="20" font-weight="normal">FK category_tag [nullable]</text><text x="556" y="393" font-size="20" font-weight="normal">FK location_id [nullable]</text><text x="556" y="424" font-size="20" font-weight="normal">FK proof_id [nullable]</text><text x="556" y="455" font-size="20" font-weight="normal">qc_core_eligible [NOT NULL]</text><rect x="30" y="180" width="340" height="127" fill="white" stroke="#454545" stroke-width="2"/><rect x="30" y="180" width="340" height="48" fill="#e6e8e9"/><text x="46" y="212" font-size="23" font-weight="bold">productos · 135.700</text><text x="46" y="258" font-size="20" font-weight="normal">PK product_code</text><text x="46" y="289" font-size="20" font-weight="normal">product_name · brands</text><rect x="30" y="455" width="340" height="96" fill="white" stroke="#454545" stroke-width="2"/><rect x="30" y="455" width="340" height="48" fill="#e6e8e9"/><text x="46" y="487" font-size="23" font-weight="bold">categorias · 593</text><text x="46" y="533" font-size="20" font-weight="normal">PK category_tag</text><rect x="1130" y="180" width="340" height="127" fill="white" stroke="#454545" stroke-width="2"/><rect x="1130" y="180" width="340" height="48" fill="#e6e8e9"/><text x="1146" y="212" font-size="23" font-weight="bold">ubicaciones · 6.608</text><text x="1146" y="258" font-size="20" font-weight="normal">PK location_id</text><text x="1146" y="289" font-size="20" font-weight="normal">country · city</text><rect x="1130" y="455" width="340" height="158" fill="white" stroke="#454545" stroke-width="2"/><rect x="1130" y="455" width="340" height="48" fill="#e6e8e9"/><text x="1146" y="487" font-size="23" font-weight="bold">proofs · 113.917</text><text x="1146" y="533" font-size="20" font-weight="normal">PK proof_id</text><text x="1146" y="564" font-size="20" font-weight="normal">proof_type</text><text x="1146" y="595" font-size="20" font-weight="normal">file_path · mimetype [privados]</text><path d="M370,245 L540,300" fill="none" stroke="#555" stroke-width="2.5"/><path d="M370,515 L540,335" fill="none" stroke="#555" stroke-width="2.5"/><path d="M960,365 L1130,245" fill="none" stroke="#555" stroke-width="2.5"/><path d="M960,397 L1130,515" fill="none" stroke="#555" stroke-width="2.5"/><text x="383" y="235" font-size="20" font-weight="bold" paint-order="stroke" stroke="white" stroke-width="7">0..1</text><text x="472" y="289" font-size="20" font-weight="bold" paint-order="stroke" stroke="white" stroke-width="7">0..N</text><text x="383" y="545" font-size="20" font-weight="bold" paint-order="stroke" stroke="white" stroke-width="7">0..1</text><text x="472" y="355" font-size="20" font-weight="bold" paint-order="stroke" stroke="white" stroke-width="7">0..N</text><text x="978" y="360" font-size="20" font-weight="bold" paint-order="stroke" stroke="white" stroke-width="7">0..N</text><text x="1060" y="235" font-size="20" font-weight="bold" paint-order="stroke" stroke="white" stroke-width="7">0..1</text><text x="978" y="419" font-size="20" font-weight="bold" paint-order="stroke" stroke="white" stroke-width="7">0..N</text><text x="1060" y="550" font-size="20" font-weight="bold" paint-order="stroke" stroke="white" stroke-width="7">0..1</text><text x="35" y="655" font-size="23" font-weight="bold">CHECK subject_check</text><text x="35" y="693" font-size="22" font-weight="normal">PRODUCT: product_code obligatorio y category_tag nulo. CATEGORY: la condición inversa.</text><text x="35" y="737" font-size="21" font-weight="normal">Las cuatro líneas son FK formales. Cada entidad puede tener 0..N precios según el DDL.</text><text x="35" y="775" font-size="21" font-weight="normal">Cada precio puede tener 0..1 ubicación y 0..1 proof; la condición PRODUCT/CATEGORY decide su sujeto.</text><text x="35" y="823" font-size="20" font-weight="normal">Staging: stg_open_prices (PK price_id, 307.183 filas), sin FK; alimenta la carga, no es otra entidad del estudio.</text><text x="35" y="863" font-size="20" font-weight="normal">Vista: vw_precios_productos conserva 307.183 price_id únicos. MongoDB se vincula lógicamente, no por FK.</text></g></svg>