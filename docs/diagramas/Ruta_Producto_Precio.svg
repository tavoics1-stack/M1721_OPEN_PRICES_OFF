<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="390" viewBox="0 0 1100 390"><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" fill="#161616"><text x="28" y="43" font-size="29" font-weight="bold">Un producto puede registrar varios precios</text><rect x="30" y="115" width="325" height="96" fill="white" stroke="#454545" stroke-width="2"/><rect x="30" y="115" width="325" height="48" fill="#e6e8e9"/><text x="46" y="147" font-size="23" font-weight="bold">productos</text><text x="46" y="193" font-size="20" font-weight="normal">PK product_code</text><rect x="645" y="115" width="420" height="127" fill="white" stroke="#454545" stroke-width="2"/><rect x="645" y="115" width="420" height="48" fill="#e6e8e9"/><text x="661" y="147" font-size="23" font-weight="bold">precios</text><text x="661" y="193" font-size="20" font-weight="normal">PK id</text><text x="661" y="224" font-size="20" font-weight="normal">FK product_code [nullable]</text><path d="M355,175 L645,175" fill="none" stroke="#555" stroke-width="2.5"/><text x="375" y="158" font-size="24" font-weight="bold" paint-order="stroke" stroke="white" stroke-width="7">0..1</text><text x="560" y="158" font-size="24" font-weight="bold" paint-order="stroke" stroke="white" stroke-width="7">0..N</text><text x="385" y="211" font-size="21" font-weight="normal">FK formal</text><text x="30" y="320" font-size="19" font-weight="normal">PRODUCT exige un producto; CATEGORY no lo utiliza. Máximo observado: 177 precios por producto.</text><text x="30" y="356" font-size="19" font-weight="normal">DDL: 0..N precios por entidad. Datos: mínimo observado 1; no equivale a obligatoriedad formal.</text></g></svg>